name: Expanded edition source tests
on:
  push:
    branches:
      - work/paid-story-ui-20261024
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
