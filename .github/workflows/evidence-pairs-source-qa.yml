name: CASE04 evidence card game QA
on:
  push:
    branches:
      - work/case04-evidence-matching-20261024
      - work/case04-card-budget-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify current paid edition and evidence-pair prototype
        run: npm test
