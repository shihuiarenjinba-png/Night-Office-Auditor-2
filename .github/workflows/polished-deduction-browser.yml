name: Paid deduction polished browser QA
on:
  push:
    branches:
      - work/three-case-release-polish-20261024
    paths:
      - 'deduction-campaign.html'
      - 'deduction-campaign.css'
      - 'src/deduction-campaign*.js'
      - 'tests/three-case-browser-smoke.cjs'
      - '.github/workflows/polished-deduction-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser QA dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Play all cases, test save reload, and capture screenshots
        run: node tests/three-case-browser-smoke.cjs
      - name: Upload QA screenshot evidence
        if: ${{ always() && hashFiles('three-case-review/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: paid-three-case-polished-browser-${{ github.sha }}
          path: three-case-review/
          retention-days: 14
          if-no-files-found: error
